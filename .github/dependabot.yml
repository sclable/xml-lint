version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    labels: [dependencies, php]

  - package-ecosystem: composer
    directories: [/tools/php-cs-fixer, /tools/phpstan]
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    labels: [dependencies, php]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
    labels: [dependencies, ci]
